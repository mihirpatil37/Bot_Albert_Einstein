<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Albert Einstein Chatbot</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=sentient@400,500,700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cream: '#f4efe3',
            sand: '#fbf7ee',
            cocoa: '#1d1b17',
            muted: '#6c655b',
            accent: '#c96442',
            accent2: '#e8b98d'
          },
          boxShadow: {
            soft: '0 14px 36px rgba(43,28,16,.08)'
          },
          borderRadius: {
            xl2: '1.5rem'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <!-- KaTeX CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  
  <!-- DOMPurify, Marked.js, and KaTeX Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-cream text-cocoa">
  <main class="page mx-auto max-w-[1280px] min-h-screen grid grid-cols-[320px_1fr] gap-4 p-6">
    <aside class="sidebar bg-sand border border-[#e3d8c7] rounded-2xl shadow-soft p-5 grid gap-4 content-start">
      <div class="brand-row flex items-center gap-3">
        <div class="logo w-12 h-12 rounded-full grid place-items-center bg-[rgba(201,100,66,.10)] text-accent font-bold">A.E</div>
        <div>
          <div class="kicker text-[.78rem] uppercase tracking-[.12em] text-muted font-semibold">Einstein Chatbot</div>
          <div class="model text-muted mt-1">Local model: <strong>{{ model }}</strong></div>
        </div>
      </div>

      <div class="panel note bg-[rgba(255,255,255,.35)] border border-[#e3d8c7] rounded-2xl p-4">
        <img src="{{ url_for('static', path='images/Albert_Einstein_Head_cleaned.jpg.webp') }}"
             alt="Albert Einstein portrait"
             class="w-full rounded-2xl border border-[#e3d8c7] shadow-soft object-cover mb-3">

        <div id="quote-box" class="mt-4 p-4 rounded-xl border border-[#e3d8c7] bg-[rgba(255,255,255,.45)]">
          <div class="text-[.78rem] uppercase tracking-[.12em] text-muted font-semibold">Einstein quote</div>
          <p id="quote-text" class="mt-2 font-['Sentient'] text-[1.05rem] leading-7"></p>
        </div>
      </div>

      <div class="panel quick bg-[rgba(255,255,255,.35)] border border-[#e3d8c7] rounded-2xl p-4 grid gap-2">
        <div class="section-label text-[.78rem] uppercase tracking-[.12em] text-muted font-semibold">Quick prompts</div>
        <button class="quick-btn px-4 py-3 rounded-full border border-[#e3d8c7] bg-[rgba(255,255,255,.45)] text-left hover:bg-[rgba(201,100,66,.10)] transition" data-prompt="Explain relativity simply.">Explain relativity</button>
        <button class="quick-btn px-4 py-3 rounded-full border border-[#e3d8c7] bg-[rgba(255,255,255,.45)] text-left hover:bg-[rgba(201,100,66,.10)] transition" data-prompt="Why is curiosity important in science?">Curiosity in science</button>
        <button class="quick-btn px-4 py-3 rounded-full border border-[#e3d8c7] bg-[rgba(255,255,255,.45)] text-left hover:bg-[rgba(201,100,66,.10)] transition" data-prompt="How should I study physics deeply?">Study physics deeply</button>
      </div>

      
    </aside>

    <section class="chat-panel bg-sand border border-[#e3d8c7] rounded-2xl shadow-soft overflow-hidden grid grid-rows-[auto_1fr_auto]" id="chat">
      <header class="chat-head p-5 border-b border-[#e3d8c7] flex items-start justify-between gap-4 bg-[linear-gradient(135deg,rgba(201,100,66,.08),rgba(232,185,141,.06))]">
        <div>
          <div class="chat-eyebrow text-[.78rem] uppercase tracking-[.12em] text-muted font-semibold">Conversation</div>
          <h1 class="mt-1 font-['Sentient'] text-[clamp(2rem,1.5rem+2vw,3.2rem)] leading-none tracking-tight">Speak with Einstein</h1>
        </div>
        <div class="status px-4 py-2 rounded-full border border-[#e3d8c7] bg-[rgba(255,255,255,.35)] text-muted whitespace-nowrap" id="status">Checking…</div>
      </header>

      <div id="messages" class="messages p-5 flex flex-col gap-4 min-h-[58vh] max-h-[56vh] overflow-auto bg-[linear-gradient(180deg,transparent,rgba(201,100,66,.03))]" aria-live="polite">
        <div class="assistant-line max-w-[760px] grid gap-1">
          <div class="assistant-label text-[.8rem] text-muted font-['Sentient'] uppercase tracking-[.12em]">Albert Einstein</div>
          <div class="assistant-text font-['Sentient'] text-[1.08rem] leading-7">Good day. Let us begin with a clear question.</div>
        </div>
      </div>

      <form id="chat-form" class="composer p-5 border-t border-[#e3d8c7] bg-[linear-gradient(180deg,transparent,rgba(255,255,255,.04))]">
        <label for="message" class="block font-semibold text-[.92rem] mb-2">Your message</label>
        <textarea id="message" placeholder="Ask Einstein something..." required class="w-full min-h-[116px] resize-y px-4 py-4 rounded-[18px] border border-[#e3d8c7] bg-[rgba(255,255,255,.45)] outline-none leading-[1.65] focus:border-[rgba(201,100,66,.45)] focus:shadow-[0_0_0_4px_rgba(201,100,66,.10)]"></textarea>
        <div class="composer-footer mt-3 flex flex-wrap items-center justify-between gap-3">
          <button type="button" id="clear" class="ghost px-4 py-3 rounded-full border border-[#e3d8c7] bg-[rgba(255,255,255,.35)] hover:bg-[rgba(201,100,66,.10)] transition">Clear</button>
          <div class="composer-actions flex items-center gap-2">
            <span class="hint text-[.82rem] text-muted">Enter to send · Shift+Enter for newline</span>
            <button type="submit" class="send px-4 py-3 rounded-full bg-accent text-white border-none min-w-[102px] hover:brightness-[.97] transition">Send</button>
          </div>
        </div>
      </form>
    </section>
  </main>
  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
